<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miguel Ángel Serrano García</title>
  <meta name="description" content="Miguel Ángel Serrano García — Ingeniería Mecánica (UPM). Powertrain, motores térmicos y fabricación.">
  <style>
    :root { --bg:#f7f7f5; --fg:#1a1a1a; --muted:#666; --accent:#c8102e; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
    main { max-width:560px; }
    h1 { font-size:clamp(1.8rem,5vw,2.6rem); margin:0 0 .3em; letter-spacing:-.02em; }
    p { color:var(--muted); line-height:1.5; margin:.4em 0; }
    .tag { display:inline-block; margin-top:1.2em; padding:.3em .7em; border:1px solid var(--accent);
           color:var(--accent); border-radius:999px; font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Miguel Ángel Serrano García</h1>
    <p>Ingeniería Mecánica · Universidad Politécnica de Madrid</p>
    <p>Powertrain, motores térmicos y fabricación.</p>
    <span class="tag">Web en construcción</span>
  </main>
</body>
</html>
