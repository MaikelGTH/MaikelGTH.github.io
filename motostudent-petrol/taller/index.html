<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller · Inventario</title>
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#111827; --ink2:#4b5563; --ink3:#9ca3af; --line:#e5e7eb;
  --accent:#ea580c; --accent-ink:#fff; --ok:#16a34a; --warn:#d97706; --err:#dc2626; --info:#2563eb;
  --cell:38px; --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* Cabecera */
header{position:sticky;top:0;z-index:30;background:#111827;color:#f9fafb;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:16px;letter-spacing:.2px}
.brand span{font-size:12px;color:#9ca3af}
.search{position:relative;flex:1 1 280px;max-width:520px}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#f9fafb}
.search input::placeholder{color:#9ca3af}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);color:var(--ink);border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,0,0,.25);max-height:65vh;overflow:auto;z-index:40}
.results .r{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line)}
.results .r:hover,.results .r.act{background:#fff7ed}
.results .r small{display:block;color:var(--ink2)}
.results .empty{padding:12px;color:var(--ink2)}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:#d1d5db}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.busy{background:var(--info);animation:pulse 1s infinite}
.dot.err{background:var(--err)}
@keyframes pulse{50%{opacity:.3}}
.hbtn{border:1px solid #374151;background:#1f2937;color:#f9fafb;border-radius:8px;padding:7px 11px;display:inline-flex;gap:6px;align-items:center}
.hbtn:hover{background:#374151}
.hbtn.on{background:var(--accent);border-color:var(--accent)}

/* Barras */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px}
.tab.act{background:#111827;color:#fff;border-color:#111827}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--ink2)}
.crumbs button{border:0;background:none;color:var(--info);padding:2px 4px;border-radius:4px}
.crumbs button:hover{background:#eff6ff}
.crumbs .sep{color:var(--ink3)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(.95)}
.btn.dan{color:var(--err);border-color:#fecaca}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 8px;font-size:12px}
.banner{margin:10px 16px 0;padding:10px 12px;border-radius:8px;font-size:13px}
.banner.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.banner.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.banner.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}

/* Admin */
.adminbar{position:sticky;top:0;z-index:25;background:#fff7ed;border-bottom:2px solid var(--accent);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adminbar b{color:#9a3412}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#fed7aa;color:#7c2d12;font-size:12px}

main{padding:16px}
.layout{display:flex;gap:16px;align-items:flex-start}
.layout>.grow{flex:1;min-width:0}

/* Plano */
.planwrap{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 210px);touch-action:pan-x pan-y;position:relative}
.plan{position:relative;display:grid;gap:2px;padding:12px;width:max-content;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:calc(var(--cell) + 2px) calc(var(--cell) + 2px);background-position:11px 11px}
.el{position:relative;border-radius:6px;border:1px solid rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px 4px;overflow:hidden;user-select:none;transition:box-shadow .15s,transform .15s}
.el .lb{font-weight:700;font-size:12px;line-height:1.1;word-break:break-word}
.el .nm{font-size:10px;opacity:.8;line-height:1.1;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el .ct{position:absolute;top:2px;right:3px;font-size:9px;font-weight:700;background:rgba(255,255,255,.85);color:#111;border-radius:999px;padding:0 5px}
.el.vert .lb{writing-mode:vertical-rl;transform:rotate(180deg);word-break:normal}
.el.vert .nm{display:none}
.el.click{cursor:pointer}
.el.click:hover{box-shadow:0 0 0 3px rgba(234,88,12,.45);z-index:2}
.el.puerta{border-style:dashed}
.el.hit{box-shadow:0 0 0 3px #facc15,0 0 16px #facc15;z-index:3}
.el.dim{opacity:.35}
.el.sel{box-shadow:0 0 0 3px var(--accent);z-index:4}
.el.edit{cursor:move}
.el .rs{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.45) 50%)}
.el.oculto{opacity:.4;outline:2px dashed #9ca3af}
.zoom{display:flex;gap:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}

/* Paneles */
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:20px}
.card h3{margin:0 0 8px;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink2);font-size:13px}
.meta b{color:var(--ink)}
.side{width:320px;flex:none;position:sticky;top:120px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 8px;align-items:center}
.kv label{font-size:12px;color:var(--ink2)}
.kv input,.kv select,.kv textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.kv input[type=color]{padding:2px;height:32px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* Mueble: estructura */
.estructura{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.seccion{flex:1 1 260px;min-width:240px;border:1px solid var(--line);border-radius:var(--radius);background:#fafafa}
.seccion>.tt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
.seccion>.bd{padding:8px}
.estante{border:2px solid #6b7280;border-radius:8px;background:#fff;overflow:hidden;width:100%}
.balda{display:flex;gap:8px;align-items:stretch;border-bottom:4px solid #9ca3af;min-height:58px;padding:6px 8px;background:linear-gradient(#fff,#f9fafb)}
.balda:last-child{border-bottom:0}
.balda.hit{background:#fef9c3}
.balda .bn{flex:none;width:92px;display:flex;flex-direction:column;justify-content:center;border:0;background:none;text-align:left;padding:0;color:var(--ink)}
.balda .bn b{font-size:13px}
.balda .bn small{color:var(--ink3);font-size:11px}
.balda .bc{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.caja{border:1px solid #d6a96b;background:#fdf3e3;border-radius:6px;padding:5px 8px;text-align:left;min-width:110px;max-width:220px}
.caja:hover{background:#fbe6c2}
.caja b{display:block;font-size:12px}
.caja small{color:#92400e;font-size:11px}
.caja.hit{outline:3px solid #facc15}
.sueltos{border:1px dashed #9ca3af;background:#fff;border-radius:6px;padding:5px 8px;font-size:12px;color:var(--ink2)}
.sueltos:hover{background:#f3f4f6}
.vacia{color:var(--ink3);font-style:italic;font-size:12px}

/* Tabla de artículos */
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);background:#f9fafb;position:sticky;top:0}
td.q{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
td .na{color:var(--ink3);font-weight:400;font-style:italic}
td .tx{color:var(--warn);font-weight:500}
tr.hit td{background:#fef9c3;animation:flash 1.6s ease 2}
@keyframes flash{50%{background:#fde047}}
td input,td select{width:100%;min-width:70px;padding:4px 6px;border:1px solid var(--line);border-radius:5px}
td input[data-f=nombre]{min-width:220px}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:#f3f4f6;display:block}
.thumb.sm{width:36px;height:36px;float:left;margin-right:8px}
td.foto{width:60px}
.fotoed{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:96px}
.fotoed label{cursor:pointer}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:85vh;border-radius:8px;background:#fff}
.lightbox p{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;margin:0}td input[data-f=observaciones],td input[data-f=descripcion]{min-width:160px}td select[data-f=ubicacion_id]{min-width:180px}
.low{color:var(--err);font-size:11px;display:block}
.filtro{padding:6px 10px;border:1px solid var(--line);border-radius:8px;min-width:200px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .box.wide{max-width:640px;max-height:85vh;overflow:auto}
.modal h3{margin:0 0 6px}
.codigo{width:100%;font-size:28px;letter-spacing:10px;text-align:center;padding:10px;border:2px solid var(--line);border-radius:10px;margin:12px 0}
.codigo:focus{outline:none;border-color:var(--accent)}
.msg{font-size:13px;min-height:18px}
.msg.err{color:var(--err)}
.issue{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.issue .g{flex:none;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;height:fit-content}
.g.ERROR{background:#fee2e2;color:#991b1b}.g.AVISO{background:#fef3c7;color:#92400e}.g.INFO{background:#dbeafe;color:#1e40af}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:70;box-shadow:var(--shadow);max-width:90vw}
.toast.err{background:var(--err)}
.loading{padding:60px;text-align:center;color:var(--ink2)}

@media (max-width:900px){
  .layout{flex-direction:column}
  .side{width:100%;position:static}
  main{padding:10px}
  :root{--cell:30px}
  .balda .bn{width:70px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><b id="titulo">Taller</b><span id="subtitulo">Inventario</span></div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar pieza, referencia, caja o mueble…" autocomplete="off" aria-label="Buscar en todo el taller">
    <div id="results" class="results hidden" role="listbox"></div>
  </div>
  <div class="sync" title="Estado de la conexión con la hoja de cálculo">
    <span id="dot" class="dot busy"></span><span id="syncTxt">Conectando…</span>
    <button class="hbtn" id="btnSync" title="Actualizar ahora desde la hoja">⟳</button>
  </div>
  <button class="hbtn" id="btnIssues" title="Problemas detectados en los datos">⚠ <span id="nIssues">0</span></button>
  <button class="hbtn" id="btnAdmin">✎ Modo edición</button>
</header>
<div id="adminbar" class="adminbar hidden"></div>
<div id="banners"></div>
<div id="nav" class="bar"></div>
<main id="main"><div class="loading">Cargando inventario desde la hoja de cálculo…</div></main>
<div id="modal"></div>

<script>window.TALLER_API = 'https://script.google.com/macros/s/AKfycbzGeHWIkLfOFFu16WVpnof9QM2j3oiJaINURLd03QsYuvQ9nPX1tgSIr3-mW7pcVqk/exec';</script>
<script>
'use strict';
/* =====================================================================
   Conexión con el backend
   - Dentro de Apps Script se usa google.script.run.
   - Alojada en otro dominio (GitHub Pages) se llama a la URL /exec de
     Apps Script, definida en window.TALLER_API.
   - En el servidor de pruebas local se usa fetch('/rpc').
   ===================================================================== */
const API = {
  call(fn, ...args) {
    if (window.google && google.script && google.script.run) {
      return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](...args));
    }
    if (window.TALLER_API) {
      const url = window.TALLER_API;
      const json = r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
      if (fn === 'apiLeer') return fetch(url + '?api=leer&huella=' + encodeURIComponent(args[0] || ''), { cache: 'no-store' }).then(json);
      const cuerpo = fn === 'apiLogin' ? { accion: 'login', codigo: args[0] }
        : fn === 'apiGuardar' ? { accion: 'guardar', token: args[0], cambios: args[1] }
        : fn === 'apiSubirImagen' ? { accion: 'imagen', token: args[0], articuloId: args[1], version: args[2], nombre: args[3], datos: args[4] }
          : { accion: 'cerrar', token: args[0] };
      // text/plain evita la comprobación previa CORS que Apps Script no admite
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo) }).then(json);
    }
    return fetch('/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn, args }) })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
};

const TIPOS_UBIC = ['mueble', 'equipo', 'zona', 'puerta', 'seccion', 'balda', 'cajon', 'caja'];
const TIPO_TXT = { mueble: 'Mueble', equipo: 'Equipo', zona: 'Zona', puerta: 'Puerta', seccion: 'Sección', balda: 'Balda', cajon: 'Cajón', caja: 'Caja' };
const TABLAS = { PLANTAS: 'planta_id', UBICACIONES: 'ubicacion_id', PLANO: 'elemento_id', INVENTARIO: 'articulo_id', CONFIG: 'clave' };
const EDITABLES = {
  PLANTAS: ['nombre', 'orden', 'filas', 'columnas', 'activo'],
  UBICACIONES: ['padre_id', 'planta_id', 'tipo', 'nombre', 'orden', 'descripcion', 'notas', 'activo'],
  PLANO: ['planta_id', 'ubicacion_id', 'etiqueta', 'tipo', 'fila', 'columna', 'ancho', 'alto', 'color', 'orden', 'visible'],
  INVENTARIO: ['ubicacion_id', 'nombre', 'cantidad', 'cantidad_texto', 'unidad', 'referencia', 'categoria', 'descripcion', 'observaciones', 'stock_minimo', 'imagen'],
  CONFIG: ['valor']
};

const S = {
  base: null,        // últimos datos leídos de la hoja
  remoto: null,      // datos nuevos llegados mientras hay un borrador
  borrador: null,    // copia editable (solo en modo edición)
  pila: [],          // deshacer
  huella: '', ultimaSync: null, errorSync: null, sincronizando: false,
  vista: { tipo: 'plano', planta: null, id: null, resaltar: null },
  token: null, tokenCaduca: null, sel: null, zoom: 1, filtroCajas: '', timer: null
};
const D = () => S.borrador || S.base;

/* ============================== utilidades ============================== */
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const vacio = v => v === '' || v === null || v === undefined;
const verdadero = v => v === true || String(v).toUpperCase() === 'TRUE' || v === 1 || String(v).toUpperCase() === 'VERDADERO' || String(v).toUpperCase() === 'SI' || String(v).toUpperCase() === 'SÍ';
const num = v => (vacio(v) ? NaN : Number(String(v).replace(',', '.')));
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const hora = d => d ? d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
function contraste(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#111827';
  const n = parseInt(m[1], 16), l = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
  return l > 0.55 ? '#111827' : '#ffffff';
}
function toast(t, err) {
  const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), err ? 6000 : 2600);
}
/** 'CAJA MOTOR 2' -> 'Caja motor 2'; respeta códigos como 'EME 10-P' o 'CNC'. Solo cambia textos escritos todo en mayúsculas. */
/* Diálogos propios (los confirm/prompt nativos pueden bloquearse dentro de Google) */
function formulario(titulo, campos, okTxt, texto) {
  return new Promise(res => {
    $('#modal').innerHTML = `<div class="modal"><form class="box" id="fdlg" autocomplete="off"><h3>${esc(titulo)}</h3>${texto ? `<p class="meta">${esc(texto)}</p>` : ''}
      ${campos.length ? `<div class="kv" style="margin-top:10px">${campos.map((c, i) => `<label for="dl${i}">${esc(c.label)}</label><input id="dl${i}" data-k="${esc(c.k)}" value="${esc(c.valor ?? '')}" ${c.tipo ? `type="${c.tipo}"` : ''}>`).join('')}</div>` : ''}
      <div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn" id="dlno">Cancelar</button><button class="btn ${okTxt && /borrar|descartar|salir/i.test(okTxt) ? 'dan' : 'pri'}" id="dlok">${esc(okTxt || 'Aceptar')}</button></div></form></div>`;
    const fin = v => { $('#modal').innerHTML = ''; res(v); };
    $('#dlno').onclick = () => fin(null);
    $('#fdlg').onsubmit = e => { e.preventDefault(); const o = {}; $('#fdlg').querySelectorAll('[data-k]').forEach(i => o[i.dataset.k] = i.value); fin(o); };
    const f = $('#fdlg').querySelector('input') || $('#dlok'); f.focus(); if (f.select) f.select();
  });
}
const preguntar = (titulo, okTxt, texto) => formulario(titulo, [], okTxt, texto).then(v => !!v);

function capital(s) {
  s = String(s || '');
  if (s !== s.toUpperCase() || !/[A-ZÁÉÍÓÚÑ]{4,}/.test(s)) return s;
  const t = s.split(' ').map(w => /^[A-ZÁÉÍÓÚÑ]{4,}$/.test(w) ? w.toLowerCase() : w).join(' ');
  return t.charAt(0).toUpperCase() + t.slice(1);
}

/* ============================== índices ============================== */
let IX = null;
function indexar() {
  const d = D(); if (!d) return;
  const ix = { u: {}, hijos: {}, items: {}, plantas: [], planoPorPlanta: {}, cfg: {}, total: {}, elPorUbic: {} };
  // Una fila sin identificador no puede contener nada ni ser padre de nada (sale en ⚠)
  const ubics = d.UBICACIONES.filter(u => String(u.ubicacion_id ?? '').trim() !== '');
  ubics.forEach(u => { ix.u[u.ubicacion_id] = u; });
  ubics.forEach(u => { const p = u.padre_id || ''; (ix.hijos[p] = ix.hijos[p] || []).push(u); });
  Object.values(ix.hijos).forEach(l => l.sort((a, b) => (num(a.orden) || 0) - (num(b.orden) || 0) || String(a.ubicacion_id).localeCompare(b.ubicacion_id)));
  d.INVENTARIO.forEach(a => { (ix.items[a.ubicacion_id] = ix.items[a.ubicacion_id] || []).push(a); });
  ix.plantas = d.PLANTAS.filter(p => p.activo === '' || verdadero(p.activo)).sort((a, b) => (num(a.orden) || 0) - (num(b.orden) || 0));
  d.PLANO.forEach(e => { (ix.planoPorPlanta[e.planta_id] = ix.planoPorPlanta[e.planta_id] || []).push(e); if (e.ubicacion_id) ix.elPorUbic[e.ubicacion_id] = e; });
  d.CONFIG.forEach(c => { ix.cfg[c.clave] = c.valor; });
  const total = id => {
    if (ix.total[id] !== undefined) return ix.total[id];
    ix.total[id] = 0; // evita bucles si hay ciclos
    let n = (ix.items[id] || []).length;
    (ix.hijos[id] || []).forEach(h => { n += total(h.ubicacion_id); });
    return (ix.total[id] = n);
  };
  d.UBICACIONES.forEach(u => total(u.ubicacion_id));
  IX = ix;
}
function ruta(id) {
  const out = []; const vistos = {};
  let u = IX.u[id];
  while (u && !vistos[u.ubicacion_id]) { vistos[u.ubicacion_id] = 1; out.unshift(u); u = u.padre_id ? IX.u[u.padre_id] : null; }
  return out;
}
function raiz(id) { const r = ruta(id); return r[0]; }
function plantaDe(id) { const r = raiz(id); return r ? r.planta_id : ''; }
function nombrePlanta(pid) { const p = D().PLANTAS.find(p => p.planta_id === pid); return p ? p.nombre : pid; }
function etiquetaUbic(u) { return u ? (u.tipo === 'mueble' || u.tipo === 'equipo' || u.tipo === 'zona' ? `${u.ubicacion_id} · ${capital(u.nombre)}` : capital(u.nombre)) : ''; }
function textoRuta(id) { return ruta(id).map(etiquetaUbic).join(' › '); }

/* ============================== validación ============================== */
function validar() {
  const d = D(), out = [];
  const add = (g, t, ir) => out.push({ g, t, ir });
  Object.entries(TABLAS).forEach(([tab, key]) => {
    const vistos = {};
    d[tab].forEach(r => {
      const id = String(r[key] ?? '').trim();
      if (!id) add('ERROR', `${tab}: hay una fila sin ${key} (fila ${r._fila || '?'})`);
      else if (vistos[id]) add('ERROR', `${tab}: identificador duplicado "${id}"`);
      vistos[id] = 1;
    });
  });
  const plantas = new Set(d.PLANTAS.map(p => p.planta_id));
  d.UBICACIONES.filter(u => IX.u[u.ubicacion_id] === u).forEach(u => {
    if (u.padre_id && !IX.u[u.padre_id]) add('ERROR', `Ubicación ${u.ubicacion_id}: su padre "${u.padre_id}" no existe`, u.ubicacion_id);
    if (!u.padre_id && !plantas.has(u.planta_id)) add('ERROR', `Mueble ${u.ubicacion_id}: planta "${u.planta_id || '(vacía)'}" no existe`, u.ubicacion_id);
    if (!TIPOS_UBIC.includes(u.tipo)) add('ERROR', `Ubicación ${u.ubicacion_id}: tipo "${u.tipo}" no válido`, u.ubicacion_id);
    if (!String(u.nombre || '').trim()) add('AVISO', `Ubicación ${u.ubicacion_id} sin nombre`, u.ubicacion_id);
    if (u.tipo === 'caja' && (!u.padre_id || !IX.u[u.padre_id])) add('ERROR', `Caja ${u.ubicacion_id} sin ubicación completa`, u.ubicacion_id);
    const r = ruta(u.ubicacion_id); if (r.length && r[0].padre_id) add('ERROR', `Ubicación ${u.ubicacion_id}: la cadena de padres forma un ciclo`, u.ubicacion_id);
  });
  d.INVENTARIO.forEach(a => {
    if (!String(a.nombre || '').trim()) add('ERROR', `Artículo ${a.articulo_id} sin nombre`, a.ubicacion_id);
    if (!IX.u[a.ubicacion_id]) add('ERROR', `Artículo ${a.articulo_id} (${a.nombre}): ubicación "${a.ubicacion_id}" no existe`);
    if (!vacio(a.cantidad) && (isNaN(num(a.cantidad)) || num(a.cantidad) < 0)) add('ERROR', `Artículo ${a.articulo_id}: cantidad no válida "${a.cantidad}"`, a.ubicacion_id);
    if (vacio(a.cantidad) && a.cantidad_texto) add('INFO', `${a.nombre}: cantidad sin número ("${a.cantidad_texto}")`, a.ubicacion_id);
    if (!vacio(a.stock_minimo) && !vacio(a.cantidad) && num(a.cantidad) < num(a.stock_minimo)) add('AVISO', `${a.nombre}: por debajo del stock mínimo (${a.cantidad} < ${a.stock_minimo})`, a.ubicacion_id);
  });
  d.PLANO.forEach(e => {
    const p = d.PLANTAS.find(p => p.planta_id === e.planta_id);
    if (!p) add('ERROR', `Plano ${e.elemento_id}: planta "${e.planta_id}" no existe`);
    if (e.ubicacion_id && !IX.u[e.ubicacion_id]) add('ERROR', `Plano ${e.elemento_id}: ubicación "${e.ubicacion_id}" no existe`);
    if (p && (num(e.columna) + num(e.ancho) - 1 > num(p.columnas) || num(e.fila) + num(e.alto) - 1 > num(p.filas))) add('AVISO', `Plano ${e.elemento_id} se sale de la cuadrícula de ${p.nombre}`);
    if (e.ubicacion_id && IX.u[e.ubicacion_id] && !IX.total[e.ubicacion_id] && IX.u[e.ubicacion_id].tipo === 'mueble') add('INFO', `${e.etiqueta}: está en el plano pero no tiene inventario`, e.ubicacion_id);
  });
  (IX.hijos[''] || []).forEach(u => {
    if (!IX.elPorUbic[u.ubicacion_id] && u.tipo !== 'puerta') add(IX.total[u.ubicacion_id] ? 'AVISO' : 'INFO', `${u.ubicacion_id} (${u.nombre}) no está dibujado en el plano`, u.ubicacion_id);
  });
  const ord = { ERROR: 0, AVISO: 1, INFO: 2 };
  return out.sort((a, b) => ord[a.g] - ord[b.g]);
}

/* ============================== sincronización ============================== */
async function sincronizar(manual) {
  if (S.sincronizando) return;
  S.sincronizando = true; pintarSync();
  try {
    const r = await API.call('apiLeer', S.borrador ? '' : S.huella);
    if (!r || !r.ok) throw new Error(r && r.error ? r.error : 'Respuesta vacía');
    S.ultimaSync = new Date(); S.errorSync = null;
    if (!r.sinCambios) {
      S.huella = r.huella;
      if (S.borrador) { S.remoto = r.datos; }
      else {
        const primera = !S.base;
        S.base = r.datos; indexar();
        if (primera && S.urlPendiente) { const p = S.urlPendiente; S.urlPendiente = null; aplicarParametros(p); }
        else pintar();
      }
    }
    if (manual) toast(r.sinCambios ? 'Ya estaba al día' : 'Datos actualizados desde la hoja');
  } catch (e) {
    S.errorSync = String(e && e.message || e);
    if (manual) toast('No se pudo leer la hoja: ' + S.errorSync, true);
  } finally {
    S.sincronizando = false; pintarSync(); pintarBanners();
    if (!S.base) $('#main').innerHTML = `<div class="card"><h3>No se pueden cargar los datos</h3><p>${esc(S.errorSync || '')}</p><button class="btn pri" onclick="sincronizar(true)">Reintentar</button></div>`;
  }
}
function programarSync() {
  clearInterval(S.timer);
  const seg = Math.max(15, num(IX && IX.cfg.intervalo_sincronizacion_seg) || 60);
  S.timer = setInterval(() => { if (!document.hidden) sincronizar(false); }, seg * 1000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(false); });

function pintarSync() {
  const dot = $('#dot'), t = $('#syncTxt');
  dot.className = 'dot' + (S.sincronizando ? ' busy' : S.errorSync ? ' err' : '');
  if (S.sincronizando) t.textContent = 'Sincronizando…';
  else if (S.errorSync) t.textContent = 'Sin conexión' + (S.ultimaSync ? ' · datos de ' + hora(S.ultimaSync) : '');
  else t.textContent = S.ultimaSync ? 'Sincronizado ' + hora(S.ultimaSync) : '';
}
function pintarBanners() {
  const b = [];
  if (S.errorSync && S.base) b.push(`<div class="banner err"><b>No se ha podido leer la hoja.</b> ${esc(S.errorSync)}<br>Se muestran los últimos datos correctos (${hora(S.ultimaSync)}). No son datos nuevos.</div>`);
  if (S.borrador && S.remoto) b.push(`<div class="banner warn">La hoja ha cambiado mientras editabas. Al guardar se comprobará que nadie haya modificado lo mismo que tú.</div>`);
  $('#banners').innerHTML = b.join('');
}

/* ============================== navegación ============================== */
function ir(v, sinHistorial) {
  S.vista = Object.assign({ tipo: 'plano', planta: S.vista.planta, id: null, resaltar: null }, v); S.sel = null; S.filtroCajas = '';
  pintar(); window.scrollTo(0, 0);
  if (!sinHistorial) guardarEnURL(false);
}

/* ---------- Enlaces directos (para QR): ?u=E2-B4-K02 · ?a=ART-0473 · ?planta=nivel-0 ---------- */
const EN_APPS_SCRIPT = !!(window.google && google.script && google.script.history);
function parametrosVista(v) {
  const p = {};
  if (v.tipo === 'ubicacion' && v.id) p.u = v.id; else if (v.planta) p.planta = v.planta;
  if (v.resaltar) p.a = v.resaltar;
  return p;
}
function enlaceVista(v) {
  const q = new URLSearchParams(parametrosVista(v)).toString();
  return location.origin + location.pathname + (q ? '?' + q : '');
}
function guardarEnURL(reemplazar) {
  const p = parametrosVista(S.vista);
  try {
    if (EN_APPS_SCRIPT) google.script.history[reemplazar ? 'replace' : 'push'](p, p);
    else history[reemplazar ? 'replaceState' : 'pushState'](p, '', enlaceVista(S.vista));
  } catch (e) { /* el navegador no deja cambiar la URL: no es grave */ }
}
/** Abre la vista que indica la URL. Acepta también ?item=, ?caja= y ?armario= con el identificador. */
function aplicarParametros(p) {
  if (!S.base) { S.urlPendiente = p; return; }
  const buscaUbic = id => { if (!id) return null; if (IX.u[id]) return id; const n = norm(id); return Object.keys(IX.u).find(k => norm(k) === n) || null; };
  const art = p.a && D().INVENTARIO.find(x => norm(x.articulo_id) === norm(p.a));
  const pedido = p.u || p.item || p.caja || p.armario || p.mueble;
  const uid = buscaUbic(pedido) || (art && art.ubicacion_id);
  if (uid) { ir({ tipo: 'ubicacion', id: uid, resaltar: art ? art.articulo_id : null, planta: plantaDe(uid) || S.vista.planta }, true); return; }
  if (pedido || p.a) toast(`No existe "${pedido || p.a}" en el inventario. Puede que se haya renombrado.`, true);
  ir({ tipo: 'plano', planta: p.planta && IX.plantas.some(x => x.planta_id === p.planta) ? p.planta : S.vista.planta }, true);
}
function leerURL(cb) {
  if (EN_APPS_SCRIPT && google.script.url) google.script.url.getLocation(l => cb(Object.fromEntries(Object.entries(l.parameter || {}))));
  else cb(Object.fromEntries(new URLSearchParams(location.search)));
}
window.addEventListener('popstate', () => leerURL(aplicarParametros));
if (EN_APPS_SCRIPT) google.script.history.setChangeHandler(e => aplicarParametros(e.state || {}));
leerURL(p => { if (Object.keys(p).length) S.urlPendiente = p; });
function copiarEnlace(v) {
  const url = enlaceVista(v);
  const ok = () => toast('Enlace copiado: ' + url);
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok, () => prompt('Copia este enlace:', url));
  else prompt('Copia este enlace:', url);
}
function irUbicacion(id, resaltar) { ir({ tipo: 'ubicacion', id, resaltar, planta: plantaDe(id) || S.vista.planta }); }

function pintar() {
  if (!S.base) return;
  indexar();
  const cfg = IX.cfg;
  $('#titulo').textContent = cfg.titulo || 'Taller';
  $('#subtitulo').textContent = cfg.subtitulo || '';
  document.title = (cfg.titulo || 'Taller') + ' · Inventario';
  if (!S.vista.planta || !IX.plantas.find(p => p.planta_id === S.vista.planta)) S.vista.planta = cfg.planta_inicial && IX.plantas.find(p => p.planta_id === cfg.planta_inicial) ? cfg.planta_inicial : (IX.plantas[0] || {}).planta_id;
  const issues = validar();
  $('#nIssues').textContent = issues.filter(i => i.g !== 'INFO').length;
  pintarAdminBar();

      ${n ? `<span class="ct">${n}</span>` : ''}${ed ? '<span class="rs" data-rs="1"></span>' : ''}</div>`;

        <div class="legend">${leyenda.map(e => `<span><i style="background:${esc(e.color)}"></i>${esc(e.etiqueta)} ${esc(capital(IX.u[e.ubicacion_id].nombre))}</span>`).join('')}</div>

function nuevoIdPlano(base) { let id = 'EL-' + base, n = 1; while (D().PLANO.some(e => e.elemento_id === id)) id = 'EL-' + base + '-' + (++n); return id; }
function nuevoElemento(id, p, uid, etiqueta, tipo) {
  const ocup = new Set(); (IX.planoPorPlanta[p.planta_id] || []).forEach(e => { for (let r = 0; r < num(e.alto); r++) for (let c = 0; c < num(e.ancho); c++) ocup.add((num(e.fila) + r) + ',' + (num(e.columna) + c)); });
  let pos = { fila: 1, columna: 1 };
  busca: for (let r = 1; r <= num(p.filas); r++) for (let c = 1; c < num(p.columnas); c++) if (!ocup.has(r + ',' + c) && !ocup.has(r + ',' + (c + 1))) { pos = { fila: r, columna: c }; break busca; }
  return { elemento_id: id, planta_id: p.planta_id, ubicacion_id: uid, etiqueta, tipo, fila: pos.fila, columna: pos.columna, ancho: 2, alto: 1, color: '#d1d5db', orden: D().PLANO.length + 1, visible: true, version: '' };
}

function arrastrar(ev, div, cell) {
  ev.preventDefault();
  const id = div.dataset.el; S.sel = id;
  const e = D().PLANO.find(x => x.elemento_id === id);
  const p = D().PLANTAS.find(x => x.planta_id === e.planta_id);
  const redim = !!ev.target.dataset.rs;
  const x0 = ev.clientX, y0 = ev.clientY, paso = cell + 2;
  const ini = { fila: num(e.fila), columna: num(e.columna), ancho: num(e.ancho), alto: num(e.alto) };
  let nuevo = Object.assign({}, ini);
  document.querySelectorAll('.el.sel').forEach(x => x.classList.remove('sel')); div.classList.add('sel');
  const mover = m => {
    const dc = Math.round((m.clientX - x0) / paso), df = Math.round((m.clientY - y0) / paso);
    if (redim) nuevo = Object.assign({}, ini, { ancho: Math.max(1, Math.min(num(p.columnas) - ini.columna + 1, ini.ancho + dc)), alto: Math.max(1, Math.min(num(p.filas) - ini.fila + 1, ini.alto + df)) });
    else nuevo = Object.assign({}, ini, { columna: Math.max(1, Math.min(num(p.columnas) - ini.ancho + 1, ini.columna + dc)), fila: Math.max(1, Math.min(num(p.filas) - ini.alto + 1, ini.fila + df)) });
    div.style.gridColumn = `${nuevo.columna} / span ${nuevo.ancho}`; div.style.gridRow = `${nuevo.fila} / span ${nuevo.alto}`;
  };
  const soltar = () => {
    window.removeEventListener('pointermove', mover); window.removeEventListener('pointerup', soltar);
    const cambio = ['fila', 'columna', 'ancho', 'alto'].some(k => nuevo[k] !== ini[k]);
    if (cambio) cambiar('PLANO', id, nuevo); else pintar();
  };
  window.addEventListener('pointermove', mover); window.addEventListener('pointerup', soltar);
}

/** imagen puede ser: id de Drive, enlace http(s) o "local:archivo" (servidor de pruebas). */
function urlImagen(v, ancho) {
  v = String(v ?? '').trim();
  if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  if (v.startsWith('local:')) return '/foto/' + encodeURIComponent(v.slice(6));
  return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(v) + '&sz=w' + (ancho || 400);
}
function miniatura(a, cls) {
  const u = urlImagen(a.imagen, 200);
  return u ? `<img class="thumb ${cls || ''}" loading="lazy" src="${esc(u)}" alt="Foto de ${esc(a.nombre)}" data-zoom="${esc(a.articulo_id)}">` : '';
}
function ampliarFoto(aid) {
  const a = D().INVENTARIO.find(x => x.articulo_id === aid); if (!a || !a.imagen) return;
  const d = document.createElement('div'); d.className = 'lightbox';
  d.innerHTML = `<img src="${esc(urlImagen(a.imagen, 1600))}" alt="Foto de ${esc(a.nombre)}"><p>${esc(a.nombre)} · ${esc(textoRuta(a.ubicacion_id))}</p>`;
  d.onclick = () => d.remove();
  document.addEventListener('keydown', function f(e) { if (e.key === 'Escape') { d.remove(); document.removeEventListener('keydown', f); } });
  document.body.appendChild(d);
}
document.addEventListener('click', e => { const z = e.target.closest('[data-zoom]'); if (z) { e.preventDefault(); e.stopPropagation(); ampliarFoto(z.dataset.zoom); } }, true);
/** Reduce la foto en el navegador (máx. 1600 px, JPEG) para que suba rápido desde el móvil. */
function reducirImagen(file, max) {
  max = max || 1600;
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se puede leer esa imagen (prueba con JPG o PNG).')); };
    img.src = url;
  });
}
async function subirFoto(aid, file, boton) {
  if (String(aid).startsWith('NUEVO-')) { toast('Guarda primero el artículo nuevo y después añade la foto', true); return; }
  const base = S.baseEdicion.INVENTARIO.find(x => x.articulo_id === aid);
  if (!base) { toast('Ese artículo ya no está en la hoja', true); return; }
  if (boton) { boton.textContent = 'Subiendo…'; boton.style.pointerEvents = 'none'; }
  try {
    const datos = await reducirImagen(file);
    const r = await API.call('apiSubirImagen', S.token, aid, base.version, file.name, datos);
    if (!r.ok) { if (r.sesion === false) { sesionCaducada(r.error); return; } toast(r.error + (r.conflictos ? ': ' + r.conflictos.join('; ') : ''), true); pintar(); return; }
    recordarSesion(r);
    // La foto ya está guardada en la hoja: se actualiza aquí sin tocar el resto del borrador
    [S.base, S.baseEdicion, S.borrador].forEach(t => { const x = t && t.INVENTARIO.find(y => y.articulo_id === aid); if (x) { x.imagen = r.imagen; x.version = r.version; } });
    toast('Foto guardada en la hoja'); pintar();
  } catch (e) { toast('No se pudo subir la foto: ' + (e.message || e), true); pintar(); }
}

/* ============================== búsqueda ============================== */
function buscar(q) {
  const res = [];
  const palabras = q.split(/\s+/).filter(Boolean);
  const casa = t => palabras.every(p => t.includes(p));
  D().INVENTARIO.forEach(a => {
    const r = ruta(a.ubicacion_id);
    const t = norm([a.nombre, a.referencia, a.articulo_id, a.categoria, a.descripcion, a.observaciones, ...r.map(x => x.nombre + ' ' + x.ubicacion_id)].join(' '));
    if (casa(t)) res.push({ tipo: 'art', a, raiz: r[0] && r[0].ubicacion_id, peso: norm(a.nombre).includes(palabras[0]) ? 0 : 1 });
  });
  D().UBICACIONES.forEach(u => {
    const t = norm(u.nombre + ' ' + u.ubicacion_id + ' ' + u.descripcion);
    if (casa(t)) res.push({ tipo: 'ubic', u, raiz: (raiz(u.ubicacion_id) || {}).ubicacion_id, peso: u.tipo === 'caja' ? -1 : -0.5 });
  });
  return res.sort((a, b) => a.peso - b.peso);
}
let selRes = -1;
function pintarResultados() {
  const q = norm($('#q').value), box = $('#results');
  if (S.vista.tipo === 'plano' && S.base) vistaPlano();
  if (q.length < 2) { box.classList.add('hidden'); return; }
  const rs = buscar(q).slice(0, 60);
  const nombres = {}; rs.forEach(r => { if (r.tipo === 'art') nombres[norm(r.a.nombre)] = (nombres[norm(r.a.nombre)] || 0) + 1; });
  box.innerHTML = rs.length ? rs.map((r, i) => r.tipo === 'art'
    ? `<button class="r ${i === selRes ? 'act' : ''}" data-i="${i}">${r.a.imagen ? `<img class="thumb sm" loading="lazy" src="${esc(urlImagen(r.a.imagen, 120))}" alt="">` : ''}<b>${esc(r.a.nombre)}</b> · ${vacio(r.a.cantidad) ? (r.a.cantidad_texto ? esc(r.a.cantidad_texto) : '<i>cantidad no disponible</i>') : esc(r.a.cantidad) + ' ' + esc(r.a.unidad || 'ud')}
        ${r.a.referencia ? ` · Ref. ${esc(r.a.referencia)}` : ''}${nombres[norm(r.a.nombre)] > 1 ? ` · <span style="color:var(--warn)">${esc(r.a.articulo_id)}</span>` : ''}<small>${esc(nombrePlanta(plantaDe(r.a.ubicacion_id)))} › ${esc(textoRuta(r.a.ubicacion_id))}</small></button>`
    : `<button class="r ${i === selRes ? 'act' : ''}" data-i="${i}">${r.u.tipo === 'caja' ? '📦' : '🗄'} <b>${esc(capital(r.u.nombre))}</b> · ${esc(TIPO_TXT[r.u.tipo])} ${esc(r.u.ubicacion_id)}<small>${esc(nombrePlanta(plantaDe(r.u.ubicacion_id)))} › ${esc(textoRuta(r.u.ubicacion_id))}</small></button>`).join('')
    : '<div class="empty">Sin resultados. Prueba con menos palabras o una referencia.</div>';
  box.classList.remove('hidden');
  box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => elegir(rs[+b.dataset.i]));
  box._rs = rs;

function elegir(r) {

}
$('#q').addEventListener('input', () => { selRes = -1; pintarResultados(); });
$('#q').addEventListener('keydown', e => {

  if (e.key === 'ArrowDown') { selRes = Math.min(rs.length - 1, selRes + 1); pintarResultados(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { selRes = Math.max(0, selRes - 1); pintarResultados(); e.preventDefault(); }
  else if (e.key === 'Enter' && rs.length) elegir(rs[Math.max(0, selRes)]);

});

/* ---------- Sesión de edición recordada en este dispositivo ---------- */
const CLAVE_SESION = 'taller_sesion_edicion';
function sesionActiva() { return !!S.token && (!S.tokenCaduca || S.tokenCaduca > Date.now()); }
/** Guarda el token que devuelve el servidor (al entrar y en cada guardado, que lo renueva). */
function recordarSesion(r) {
  if (!r || !r.token) return;
  S.token = r.token; S.tokenCaduca = r.caduca || null;
  try { localStorage.setItem(CLAVE_SESION, JSON.stringify({ token: S.token, caduca: S.tokenCaduca })); } catch (e) { /* navegador sin almacenamiento: dura lo que la pestaña */ }
}
function olvidarSesion() {
  S.token = null; S.tokenCaduca = null;
  try { localStorage.removeItem(CLAVE_SESION); } catch (e) { }
}
function textoCaducidad() {
  if (!S.tokenCaduca) return '';
  const d = new Date(S.tokenCaduca);
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}
try {
  const g = JSON.parse(localStorage.getItem(CLAVE_SESION) || 'null');
  if (g && g.token && (!g.caduca || g.caduca > Date.now())) { S.token = g.token; S.tokenCaduca = g.caduca || null; }
  else localStorage.removeItem(CLAVE_SESION);
} catch (e) { }
/** La sesión ha caducado en el servidor: se pide el código otra vez SIN perder el borrador. */
function sesionCaducada(msg) {
  olvidarSesion();
  toast((msg || 'La sesión de edición ha caducado.') + ' Tus cambios siguen aquí.', true);
  dialogoCodigo();
}

function entrarEdicion() {

async function salirEdicion(forzar) {
  if (!forzar && cambiosPendientes().length && !await preguntar('Hay cambios sin guardar', 'Salir y descartarlos', '¿Quieres salir del modo edición? Los cambios no guardados se perderán.')) return;
  // Salir de edición NO cierra la sesión: la próxima vez entra sin pedir el código (botón «Cerrar sesión» para eso)
  S.borrador = null; S.baseEdicion = null; S.pila = []; S.sel = null;

function accion(fn) { S.pila.push(JSON.stringify(S.borrador)); if (S.pila.length > 80) S.pila.shift(); fn(); }
function cambiar(tabla, id, campos) {
  const key = TABLAS[tabla];
  accion(() => { const r = D()[tabla].find(x => String(x[key]) === String(id)); if (r) Object.assign(r, campos); });
  pintar();
}
function deshacer() { if (!S.pila.length) return; S.borrador = JSON.parse(S.pila.pop()); pintar(); }
async function cancelarCambios() { if (!cambiosPendientes().length) return; if (!await preguntar('¿Descartar todos los cambios sin guardar?', 'Descartar')) return; S.borrador = clone(S.baseEdicion); S.pila = []; pintar(); }

function cambiosPendientes() {
  if (!S.borrador) return [];
  const out = [];
  const orden = ['PLANTAS', 'UBICACIONES', 'PLANO', 'INVENTARIO', 'CONFIG'];
  const igual = (a, b) => String(a ?? '') === String(b ?? '') || (verdadero(a) && verdadero(b));
  orden.forEach(t => {
    const key = TABLAS[t], antes = {}, ahora = {};
    S.baseEdicion[t].forEach(r => antes[r[key]] = r); S.borrador[t].forEach(r => ahora[r[key]] = r);
    S.borrador[t].forEach(r => {
      const a = antes[r[key]];
      if (!a) { const campos = {}; EDITABLES[t].forEach(k => { if (!vacio(r[k])) campos[k] = r[k]; }); out.push({ tabla: t, op: 'crear', id: t === 'INVENTARIO' ? undefined : r[key], tmp: r[key], campos }); return; }
      const campos = {}, previos = {}; EDITABLES[t].forEach(k => { if (!igual(a[k], r[k])) { campos[k] = r[k]; previos[k] = a[k]; } });
      if (Object.keys(campos).length) out.push({ tabla: t, op: 'actualizar', id: r[key], version: a.version, campos, antes: previos });
    });
    S.baseEdicion[t].forEach(r => { if (!ahora[r[key]]) out.push({ tabla: t, op: 'borrar', id: r[key], version: r.version }); });
  });
  // Borrar primero artículos, después elementos del plano y al final ubicaciones
  const peso = c => c.op === 'borrar' ? (c.tabla === 'UBICACIONES' ? 3 : 2) : c.op === 'crear' ? (c.tabla === 'UBICACIONES' || c.tabla === 'PLANTAS' ? 0 : 1) : 1;
  return out.sort((a, b) => peso(a) - peso(b));
}
async function guardar() {
  const cambios = cambiosPendientes();
  if (!cambios.length) { toast('No hay cambios que guardar'); return; }
  const errores = validar().filter(i => i.g === 'ERROR');
  if (errores.length && !await preguntar(`Hay ${errores.length} error${errores.length > 1 ? 'es' : ''} en los datos`, 'Guardar igualmente', 'Son errores que ya existen o que has creado (pulsa ⚠ para verlos). Guardar no los empeora, pero conviene corregirlos.')) return;
  const btn = $('#btnGuardar'); if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  try {
    const r = await API.call('apiGuardar', S.token, cambios);
    if (!r.ok) {
      if (r.sesion === false) { sesionCaducada(r.error); return; }
      dialogoError(r); return;
    }
    recordarSesion(r);
    toast(`Guardado en la hoja: ${r.aplicados} cambio${r.aplicados > 1 ? 's' : ''}`);
    // Releer la hoja para trabajar sobre la versión real
    const l = await API.call('apiLeer', '');
    if (l.ok) { S.base = l.datos; S.huella = l.huella; S.ultimaSync = new Date(); S.remoto = null; S.borrador = clone(S.base); S.baseEdicion = clone(S.base); S.pila = []; }
    pintar();
  } catch (e) { toast('No se pudo guardar: ' + (e.message || e) + '. Tus cambios siguen aquí; vuelve a intentarlo.', true); }
  finally { pintarAdminBar(); }
}
function dialogoError(r) {
